# front-door and cloudflared: a customer deployment's way in
# (docs/customer-cloud.md). Cloudflare Access signs people in; cloudflared
# dials out to Cloudflare and hands requests to front-door's socket, which
# checks the Access token before agentd or noVNC see anything. Both units
# read their settings from this desktop's own SSM path at each start, and
# keep trying until the customer has put them there.

- name: Check this desktop's settings path
  ansible.builtin.assert:
    that:
      - desktop_env | default('') is match('^[a-z][a-z0-9-]{1,19}$')
      - desktop_owner | default('') is match('^[a-z][a-z0-9-]{1,19}$')
    fail_msg: >-
      A front-door desktop needs its environment and name (EC2 tags Env and User,
      set by terraform/stacks/customer) for its settings at /front-door/<env>/<name>.
    quiet: true

- name: Install boto3 (the settings fetcher)
  ansible.builtin.apt:
    name: python3-boto3
    state: present

# --- Users ---------------------------------------------------------------------

# Members of agentd can open agentd's socket; members of front-door, front-door's.
- name: Create the agentd and front-door groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop: [agentd, front-door]

- name: Create the front-door system user
  ansible.builtin.user:
    name: front-door
    system: true
    group: front-door
    groups: agentd
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Create the cloudflared system user
  ansible.builtin.user:
    name: cloudflared
    system: true
    groups: front-door
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

# --- front-door ----------------------------------------------------------------

- name: Install front-door
  ansible.builtin.copy:
    src: "{{ front_door_binary }}"
    dest: /usr/local/bin/front-door
    mode: "0755"
  notify: Restart front-door

- name: Install the settings fetcher
  ansible.builtin.copy:
    src: front-door-settings
    dest: /usr/local/sbin/front-door-settings
    mode: "0755"
  notify:
    - Restart front-door
    - Restart cloudflared

- name: Install the front-door unit
  ansible.builtin.template:
    src: front-door.service.j2
    dest: /etc/systemd/system/front-door.service
    mode: "0644"
  notify: Restart front-door

# --- cloudflared ---------------------------------------------------------------

- name: Download cloudflared (checked against the release's SHA-256)
  ansible.builtin.get_url:
    url: "https://github.com/cloudflare/cloudflared/releases/download/{{ front_door_cloudflared_version }}/cloudflared-linux-{{ front_door_deb_arch }}.deb"
    dest: "/var/cache/cloudflared-{{ front_door_cloudflared_version }}-{{ front_door_deb_arch }}.deb"
    checksum: "sha256:{{ front_door_cloudflared_sha256[front_door_deb_arch] }}"
    mode: "0644"
  vars:
    front_door_deb_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
  register: front_door_cloudflared_deb

- name: Install cloudflared
  ansible.builtin.apt:
    deb: "{{ front_door_cloudflared_deb.dest }}"
  notify: Restart cloudflared

- name: Install the cloudflared unit
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    mode: "0644"
  notify: Restart cloudflared

# --- Start ---------------------------------------------------------------------

- name: Enable and start front-door and cloudflared
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [front-door, cloudflared]
