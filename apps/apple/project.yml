# XcodeGen spec: `xcodegen generate` creates CloudDesktop.xcodeproj (not checked in).
name: CloudDesktop
options:
  bundleIdPrefix: com.tzumby
  deploymentTarget:
    iOS: "18.1" # TailscaleKit's minimum
    macOS: "15.6" # DesktopKit's minimum
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4UVAPZYV4Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    # The release scripts set a new build number for each upload.
    CURRENT_PROJECT_VERSION: "1"
    # Which APNs servers the app's device token belongs to: development for
    # Xcode installs (make app-device, make app-mac), production for TestFlight
    # and the notarized Mac app (scripts/release-*.sh). The app tells agentd, and
    # the push relay sends to the matching servers.
    APS_ENVIRONMENT: development
packages:
  DesktopKit:
    path: DesktopKit
# Two apps, one bundle id (so the push relay's one APNs topic covers both).
# CloudDesktop/ is shared; CloudDesktop/iOS and CloudDesktop/macOS hold what
# only one of them has.
targets:
  CloudDesktop:
    type: application
    platform: iOS
    deploymentTarget: "26.0" # Liquid Glass; the DesktopKit package stays at 18.1
    sources:
      - path: CloudDesktop
        excludes: ["macOS/**"]
    dependencies:
      - package: DesktopKit
        products: [Tailnet, AgentAPI, ChatCore, DesktopViewer]
    entitlements:
      path: CloudDesktop/iOS/CloudDesktop.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: CloudDesktop/iOS/Info.plist
      properties:
        CFBundleDisplayName: Cloud Desktop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APSEnvironment: $(APS_ENVIRONMENT)
        NSCameraUsageDescription: To scan the setup code you were sent.
        # Setup links for testers' devices: clouddesktop://join?key=… (SetupLink)
        CFBundleURLTypes:
          - CFBundleURLName: com.tzumby.clouddesktop.setup
            CFBundleURLSchemes: [clouddesktop]
        UILaunchScreen:
          UIColorName: LaunchBackground # black, like the splash
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tzumby.clouddesktop
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false

  CloudDesktopMac:
    type: application
    platform: macOS
    # Runs on macOS 15.6 too, where the app draws materials instead of Liquid Glass.
    deploymentTarget: "15.6"
    sources:
      - path: CloudDesktop
        excludes: ["iOS/**"]
    dependencies:
      - package: DesktopKit
        products: [Tailnet, AgentAPI, ChatCore, DesktopViewer]
    entitlements:
      path: CloudDesktop/macOS/CloudDesktop.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # The app's Tailscale node serves its SOCKS5 proxy on 127.0.0.1.
        com.apple.security.network.server: true
        # Memory: import a file, save an export.
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)
    info:
      path: CloudDesktop/macOS/Info.plist
      properties:
        CFBundleDisplayName: Cloud Desktop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APSEnvironment: $(APS_ENVIRONMENT)
        CFBundleURLTypes:
          - CFBundleURLName: com.tzumby.clouddesktop.setup
            CFBundleURLSchemes: [clouddesktop]
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tzumby.clouddesktop
        PRODUCT_NAME: Cloud Desktop
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        ARCHS: arm64 # TailscaleKit has no Intel slice
