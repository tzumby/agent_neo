# The shell user's way out: Squid on localhost. The firewall
# (guard.nft) lets that user reach the internet only through it, without DNS
# of its own; the proxy allows listed hosts, refuses internal addresses (also
# when a listed name resolves to one) and logs every request.

- name: Create the Squid systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/squid.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Bind Squid to the network guard
  ansible.builtin.copy:
    dest: /etc/systemd/system/squid.service.d/neo-agent-guard.conf
    content: |
      [Unit]
      BindsTo=neo-agent-guard.service
      After=neo-agent-guard.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Squid

# The root-owned helper applies the app's exact hostname list and restarts Squid.
- name: Create the directory for the sites the user allowed
  ansible.builtin.file:
    path: "{{ agentd_egress_user_hosts | dirname }}"
    state: directory
    owner: root
    group: proxy
    mode: "0750"
  when: agentd_egress_user_hosts | length > 0

- name: Start the list of sites the user allowed (agentd keeps it after)
  ansible.builtin.copy:
    dest: "{{ agentd_egress_user_hosts }}"
    content: "# Sites allowed through the app.\n"
    owner: root
    group: proxy
    mode: "0640"
    force: false
  when: agentd_egress_user_hosts | length > 0

- name: Configure Squid as the shell user's egress proxy
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: "0644"
    validate: squid -k parse -f %s
  notify: Restart Squid

# The request log: daily, two weeks kept, compressed. Squid's own rotation is
# off (logfile_rotate 0), so this is the only one.
- name: Rotate Squid's logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/squid
    content: |
      # Managed by Ansible (agentd role: tasks/egress.yml).
      /var/log/squid/*.log {
          daily
          rotate {{ agentd_squid_log_days }}
          maxsize 200M
          compress
          delaycompress
          missingok
          notifempty
          nocreate
          sharedscripts
          postrotate
              test ! -e /run/squid.pid || test ! -x /usr/sbin/squid || /usr/sbin/squid -k rotate
          endscript
      }
    mode: "0644"

- name: Run Squid
  ansible.builtin.systemd_service:
    name: squid
    enabled: true
    state: started
