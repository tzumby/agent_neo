#!/usr/sbin/nft -f
# The gateway's own firewall (behind its security group): in, only the
# gateway's port; out, only what gatewayd and the OS need.
flush ruleset

table inet gateway {
    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        meta l4proto icmp accept
        tcp dport 8443 accept
    }

    chain output {
        type filter hook output priority 0; policy drop;
        oif lo accept
        ct state established,related accept
        meta l4proto icmp accept
        ip daddr 169.254.169.254 tcp dport 80 accept  # instance metadata (IMDSv2)
        ip daddr 169.254.169.123 udp dport 123 accept # Amazon Time Sync
        udp dport 67 accept                           # DHCP
        meta l4proto { tcp, udp } th dport 53 accept  # DNS (the VPC resolver)
        tcp dport 443 accept                          # Together, STS, SSM, DynamoDB
    }
}
