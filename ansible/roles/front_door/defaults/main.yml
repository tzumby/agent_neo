# Built by `make front-door-build` (services/front-door).
front_door_binary: "{{ playbook_dir }}/../../services/front-door/build/front-door-linux-{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
front_door_novnc: http://127.0.0.1:6080
front_door_agentd_socket: /run/agentd/agentd.sock
# Where cloudflared connects: the customer's published application points at
# unix:/run/front-door/front.sock (docs/customer-cloud.md). No TCP port.
front_door_listen: unix:/run/front-door/front.sock
# The web app (apps/web/public), served by front-door at / and /assets/.
front_door_web_src: "{{ playbook_dir }}/../../apps/web/public/"
front_door_web_dir: /usr/local/share/front-door/web

# This desktop's own settings in SSM, which only it may read (Terraform's
# desktop_identity own_parameters_path): team_domain, aud, allow, tunnel_token.
front_door_parameters: "/front-door/{{ desktop_env }}/{{ desktop_owner }}"
front_door_region: "{{ lookup('ansible.builtin.env', 'AWS_REGION', default='ca-central-1') }}"

# cloudflared from Cloudflare's GitHub release, pinned by the SHA-256 the
# release publishes (cloudflare/cloudflared, "SHA256 Checksums").
front_door_cloudflared_version: 2026.10.7
front_door_cloudflared_sha256:
  amd64: 70b1a1e0f46033ffc8d90b406e554044ba6cbf2e4360295ef1163aed31e09393
  arm64: d9407eb6e70ac31f54978a6b408a0320b51b664a6d0b498248692d7ac56bf836
