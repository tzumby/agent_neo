desktop_user: agent
desktop_home: /home/agent

desktop_display: ":1"
# X access cookie: only clients that can read it (the desktop user) may use
# the screen.
desktop_xauthority: "{{ desktop_home }}/.Xauthority"
desktop_width: 1280
desktop_height: 800
desktop_depth: 24

# Native apps through Hybrid Computer Use (docs/desktop-apps.md), when a
# deployment opts in (group_vars): XFCE then runs on the user's own bus, which
# the desktop broker shares, and Chrome stays off the accessibility bus. The
# rest (HCU, the apps, the broker) is the agentd role's.
desktop_apps: false

desktop_config_dir: /etc/neo-agent
desktop_libexec_dir: /usr/local/lib/neo-agent

chrome_start_url: ""
chrome_debug_port: 9222
vnc_port: 5900
novnc_port: 6080
# Without a VNC password, keep noVNC on localhost: reached only through SSM
# port forwarding and tailnet-proxy (tailnet).
novnc_bind: 127.0.0.1
vnc_password_enabled: false

desktop_packages:
  - nftables
  - xvfb
  - xfce4
  - xfce4-terminal
  - dbus-x11
  - x11vnc
  - novnc
  - websockify
  - xdotool
  - scrot
  - x11-utils
  - xauth
  # The user's own session bus (systemd --user), which XFCE uses with native apps on.
  - dbus-user-session
  - x11-xserver-utils
  - adwaita-icon-theme
  - fonts-noto-core
  - fonts-noto-color-emoji
  - fonts-noto-cjk
  - fonts-liberation2
  - python3-venv
  # Time zones for agentd's scheduled tasks (daylight saving included).
  - tzdata

# Anything that could blank or lock the screen.
desktop_removed_packages:
  - light-locker
  - xfce4-screensaver
  - xfce4-power-manager

# Started in this order.
desktop_units:
  - xvfb
  - xfce
  - chrome
  - x11vnc
  - novnc

# Chrome enterprise policies (/etc/opt/chrome/policies/managed).
desktop_chrome_policy:
  PasswordManagerEnabled: false
  # Web apps try to open their desktop apps (Slack's web client opens
  # slack://…). Chrome then asks "Open xdg-open?" in its own UI, which the
  # agent can't see or answer over DevTools, so the task hangs; and there are
  # no such apps here. Blocked schemes fail quietly and the web app stays in
  # the browser ("custom_scheme:*" is the policy's documented form). Add a
  # scheme here when another app's prompt turns up.
  URLBlocklist:
    - "slack:*"
    - "zoommtg:*"
    - "zoomus:*"
    - "zoomphonecall:*"
    - "msteams:*"
    - "ms-teams:*"
    - "webex:*"
    - "wbx:*"
    - "discord:*"
    - "figma:*"
    - "notion:*"
    - "linear:*"
    - "spotify:*"
    - "tg:*"
    - "whatsapp:*"
    - "skype:*"
    - "ms-outlook:*"
    - "ms-word:*"
    - "ms-excel:*"
    - "ms-powerpoint:*"
    - "onenote:*"
    - "vscode:*"
    - "vscode-insiders:*"
    - "cursor:*"
    - "jetbrains:*"
    - "x-github-client:*"
    - "postman:*"
    - "onepassword:*"
  # For other schemes the prompt still appears, without "Always allow…", so
  # nobody makes xdg-open permanent from Take over.
  ExternalProtocolDialogShowAlwaysOpenCheckbox: false
  # No print dialog (a page's window.print(), Ctrl+P): it's Chrome's own UI,
  # which the agent can't see either, and there's no printer here.
  PrintingEnabled: false
