[defaults]
inventory = inventory/aws_ec2.yml
roles_path = roles
interpreter_python = /usr/bin/python3
host_key_checking = False
callback_result_format = yaml
forks = 20
timeout = 60
# Run notified handlers even when a later task fails, so a half-done run
# never leaves a changed config without its restart.
force_handlers = True

[inventory]
enable_plugins = amazon.aws.aws_ec2
