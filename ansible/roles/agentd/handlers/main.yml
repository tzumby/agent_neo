- name: Reload the firewall rules
  ansible.builtin.systemd_service:
    name: neo-agent-guard
    state: reloaded
    daemon_reload: true

- name: Restart Squid
  ansible.builtin.systemd_service:
    name: squid
    state: restarted
    daemon_reload: true

- name: Restart agentd
  ansible.builtin.systemd_service:
    name: agentd
    state: restarted
    daemon_reload: true

- name: Restart the desktop broker
  ansible.builtin.systemd_service:
    name: neo-desktop-broker.service
    state: restarted
    daemon_reload: true
  when: agentd_desktop_apps | bool
