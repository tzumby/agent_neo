# Native apps through Hybrid Computer Use (docs/desktop-apps.md): HCU's
# pinned release, what its Linux provider needs, the apps the agent may use,
# and the desktop broker (this binary, as the desktop user) on a socket only
# agentd can open. After both users exist, which is why it's this role's.

# The pinned release ships linux/amd64 only (agentd_hcu_sha256).
- name: Check HCU has a verified build for this architecture
  ansible.builtin.assert:
    that: ansible_facts.architecture == 'x86_64'
    fail_msg: >-
      HCU {{ agentd_hcu_version }} has a verified build for amd64 only. For {{ ansible_facts.architecture }},
      build the pinned source and check it on a desktop of that architecture first
      (docs/desktop-apps.md §7); or set desktop_apps: false.

- name: Install what HCU's Linux provider needs, and the apps
  ansible.builtin.apt:
    name: "{{ agentd_hcu_packages + (agentd_desktop_apps_allowed | map(attribute='package') | list) }}"
    state: present
    install_recommends: false

- name: Create HCU's download and install directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /var/cache/neo-agent/hcu
    - "{{ agentd_hcu_dir }}"
    - "{{ agentd_hcu_dir }}/licenses"

# Checked against the pinned SHA-256 before it's unpacked.
- name: Download HCU's release
  ansible.builtin.get_url:
    url: "https://github.com/microsoft/Hybrid-Computer-Use/releases/download/v{{ agentd_hcu_version }}/computer-use-{{ agentd_hcu_version }}-linux-amd64.tar.gz"
    dest: /var/cache/neo-agent/hcu/computer-use-{{ agentd_hcu_version }}-linux-amd64.tar.gz
    checksum: "sha256:{{ agentd_hcu_sha256.amd64.archive }}"
    mode: "0644"

- name: Unpack computer-use
  ansible.builtin.unarchive:
    src: /var/cache/neo-agent/hcu/computer-use-{{ agentd_hcu_version }}-linux-amd64.tar.gz
    dest: "{{ agentd_hcu_dir }}"
    remote_src: true
    include: [computer-use]
    owner: root
    group: root
    creates: "{{ agentd_hcu_dir }}/computer-use"

- name: Read computer-use's checksum
  ansible.builtin.stat:
    path: "{{ agentd_hcu_dir }}/computer-use"
    checksum_algorithm: sha256
  register: agentd_hcu_binary

- name: Check computer-use is the pinned binary
  ansible.builtin.assert:
    that: agentd_hcu_binary.stat.checksum == agentd_hcu_sha256.amd64.binary
    fail_msg: "{{ agentd_hcu_dir }}/computer-use isn't HCU {{ agentd_hcu_version }}'s binary: remove it and run again"

- name: Make computer-use root's, read-only to others
  ansible.builtin.file:
    path: "{{ agentd_hcu_dir }}/computer-use"
    owner: root
    group: root
    mode: "0755"

# The release's license and notices, beside the binary.
- name: Install HCU's license and notices
  ansible.builtin.copy:
    src: "hcu/{{ item }}"
    dest: "{{ agentd_hcu_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
    - licenses/Apache-2.0.txt
    - licenses/MIT-cua-yabai.txt
    - licenses/MIT-open-codex-computer-use.txt
    - licenses/Playwright-NOTICE.txt

- name: Look up the desktop user
  ansible.builtin.getent:
    database: passwd
    key: "{{ agentd_desktop_user }}"

- name: Create the broker's configuration directory
  ansible.builtin.file:
    path: /etc/neo-desktop
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the broker's configuration
  ansible.builtin.template:
    src: broker.toml.j2
    dest: /etc/neo-desktop/broker.toml
    owner: root
    group: "{{ agentd_desktop_user }}"
    mode: "0640"
  vars:
    agentd_desktop_uid: "{{ ansible_facts.getent_passwd[agentd_desktop_user][1] }}"
    agentd_desktop_home: "{{ ansible_facts.getent_passwd[agentd_desktop_user][4] }}"
  notify: Restart the desktop broker

- name: Install the broker's socket and unit
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - neo-desktop-broker.socket
    - neo-desktop-broker.service
  notify: Restart the desktop broker

- name: Start the broker's socket
  ansible.builtin.systemd_service:
    name: neo-desktop-broker.socket
    enabled: true
    state: started
    daemon_reload: true

# With the session: XFCE wants it, so it starts again with every XFCE start.
- name: Start the broker
  ansible.builtin.systemd_service:
    name: neo-desktop-broker.service
    enabled: true
    state: started
