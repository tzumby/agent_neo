- name: Check the host is amd64 or arm64
  ansible.builtin.command: dpkg --print-architecture
  register: desktop_dpkg_arch
  changed_when: false
  failed_when: desktop_dpkg_arch.stdout not in ['amd64', 'arm64']

# --- Packages ----------------------------------------------------------------

- name: Install the X stack, XFCE, VNC and fonts
  ansible.builtin.apt:
    name: "{{ desktop_packages }}"
    state: present
    install_recommends: false

- name: Remove screen lockers and power management
  ansible.builtin.apt:
    name: "{{ desktop_removed_packages }}"
    state: absent

# --- Google Chrome from Google's signed apt repo --------------------------------

- name: Download Google's apt signing key
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /etc/apt/keyrings/google-chrome.asc
    mode: "0644"

# Only bootstraps the first install. After that the Chrome package (postinst
# and /etc/cron.daily/google-chrome) owns this file and rewrites it with its
# own URI and embedded signing key, so don't overwrite it.
- name: Add the Google Chrome apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/google-chrome.sources
    content: |
      Types: deb
      URIs: https://dl.google.com/linux/chrome/deb/
      Suites: stable
      Components: main
      Architectures: {{ desktop_dpkg_arch.stdout }}
      Signed-By: /etc/apt/keyrings/google-chrome.asc
    mode: "0644"
    force: false

# A new repo's packages aren't in apt's lists until they're updated, and the
# common role updated them minutes ago, which the install below counts as
# fresh. So if apt doesn't know Chrome yet (a first install, or a run that
# stopped after adding the repo), update the lists now.
- name: Check whether apt knows Chrome yet
  ansible.builtin.command: apt-cache show google-chrome-stable
  register: desktop_chrome_known
  changed_when: false
  failed_when: false

# Latest on every run, and daily in between (below).
- name: Install Google Chrome stable
  ansible.builtin.apt:
    name: google-chrome-stable
    state: latest
    update_cache: true
    cache_valid_time: "{{ 3600 if desktop_chrome_known.rc == 0 else 0 }}"

# Chrome reads the pages the agent opens, attackers' included, so its fixes
# matter most. Unattended upgrades install them daily with Ubuntu's security
# updates; the maintenance window (common role) restarts into them.
- name: Update Chrome automatically
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52neo-agent-chrome
    content: |
      // Managed by Ansible (desktop role). Google's repo: Origin "Google LLC",
      // Label "Google", suite and codename "stable".
      Unattended-Upgrade::Origins-Pattern {
        "origin=Google LLC,label=Google,codename=stable";
      };
    mode: "0644"

- name: Check that Chrome runs
  ansible.builtin.command: google-chrome --version
  register: desktop_chrome_version
  changed_when: false

- name: Show the Chrome version
  ansible.builtin.debug:
    msg: "{{ desktop_chrome_version.stdout }}"

- name: Create the Chrome managed policy directory
  ansible.builtin.file:
    path: /etc/opt/chrome/policies/managed
    state: directory
    mode: "0755"
  tags: [chrome_policy]

# You log in to sites yourself through the viewer; the browser must never
# store your passwords, where the agent could reach them. Chrome picks up changes here
# without a restart.
- name: Install the Chrome policy
  ansible.builtin.copy:
    dest: /etc/opt/chrome/policies/managed/neo-agent.json
    content: "{{ desktop_chrome_policy | combine(desktop_chrome_link_policy) | to_nice_json }}\n"
    mode: "0644"
  vars:
    # An app's links are taken off the blocklist and launched from its sites.
    desktop_chrome_link_schemes: "{{ desktop_chrome_app_links | map(attribute='protocol') | map('regex_replace', '$', ':*') | list }}"
    desktop_chrome_link_policy: >-
      {{ {} if not desktop_chrome_app_links else {
           'URLBlocklist': desktop_chrome_policy.URLBlocklist | reject('in', desktop_chrome_link_schemes) | list,
           'AutoLaunchProtocolsFromOrigins': desktop_chrome_app_links,
         } }}
  tags: [chrome_policy]

# --- The agent user ----------------------------------------------------------

- name: Create the agent user
  ansible.builtin.user:
    name: "{{ desktop_user }}"
    home: "{{ desktop_home }}"
    shell: /bin/bash
    create_home: true
  register: desktop_user_info

# A desktop first set up while the inventory's desktop_user was its person's
# name (now desktop_owner) runs as that account, which owns the home. Hand
# the home to this one, or Chrome can't open its profile once the units below
# switch to it (their restart comes after this, in the handlers).
- name: Find who owns the agent user's home
  ansible.builtin.stat:
    path: "{{ desktop_home }}"
  register: desktop_home_stat

- name: Give the agent user its home
  ansible.builtin.command: chown -R {{ desktop_user }}:{{ desktop_user }} {{ desktop_home }}
  when: desktop_home_stat.stat.pw_name != desktop_user

# Other local users (the agent's shell user) can't read the Chrome profile or
# the X cookie.
- name: Keep the agent user's home private
  ansible.builtin.file:
    path: "{{ desktop_home }}"
    state: directory
    mode: "0750"

# Gives the user a /run/user/<uid> runtime dir without a login session.
- name: Enable lingering for the agent user
  ansible.builtin.command: loginctl enable-linger {{ desktop_user }}
  args:
    creates: /var/lib/systemd/linger/{{ desktop_user }}

- name: Create the XFCE config directories
  ansible.builtin.file:
    path: "{{ desktop_home }}/{{ item }}"
    state: directory
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0700"
  loop:
    - .config
    - .config/xfce4
    - .config/xfce4/xfconf
    - .config/xfce4/xfconf/xfce-perchannel-xml

# Without this, the panel asks "use default config / one empty panel?" on
# first start.
- name: Seed the default XFCE panel layout
  ansible.builtin.copy:
    src: /etc/xdg/xfce4/panel/default.xml
    dest: "{{ desktop_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml"
    remote_src: true
    force: false
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0644"

# --- VNC password ------------------------------------------------------------
# Off by default: the viewer is only reachable over SSM port forwarding and the
# tailnet (tailnet-proxy), which already limit access to you.
# TODO(M2): when on, generate per desktop at boot from desktop.env instead.
# Generating it here would bake one password into the AMI for every desktop.

- name: Create the config directory
  ansible.builtin.file:
    path: "{{ desktop_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the browser network rules
  ansible.builtin.template:
    src: browser-guard.nft.j2
    dest: "{{ desktop_config_dir }}/browser-guard.nft"
    owner: root
    group: root
    mode: "0644"
  notify: Reload the browser network rules

- name: Install the browser network guard unit
  ansible.builtin.template:
    src: neo-agent-browser-guard.service.j2
    dest: /etc/systemd/system/neo-agent-browser-guard.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload the browser network rules

- name: Apply the browser network restrictions before starting Chrome
  ansible.builtin.systemd_service:
    name: neo-agent-browser-guard
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Generate a VNC password
  ansible.builtin.shell: |
    umask 077
    openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 8 > {{ desktop_config_dir }}/vnc-password
  args:
    creates: "{{ desktop_config_dir }}/vnc-password"
  when: vnc_password_enabled

- name: Write the x11vnc password file
  ansible.builtin.shell: |
    x11vnc -storepasswd "$(cat {{ desktop_config_dir }}/vnc-password)" {{ desktop_config_dir }}/vncpass
  args:
    creates: "{{ desktop_config_dir }}/vncpass"
  when: vnc_password_enabled

- name: Let the agent user read the x11vnc password file
  ansible.builtin.file:
    path: "{{ desktop_config_dir }}/vncpass"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0400"
  when: vnc_password_enabled

- name: Remove the VNC password when it's turned off
  ansible.builtin.file:
    path: "{{ desktop_config_dir }}/{{ item }}"
    state: absent
  loop:
    - vnc-password
    - vncpass
  when: not vnc_password_enabled

# --- systemd units -----------------------------------------------------------

- name: Create the helper script directory
  ansible.builtin.file:
    path: "{{ desktop_libexec_dir }}"
    state: directory
    mode: "0755"

- name: Install the display helpers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ desktop_libexec_dir }}/{{ item }}"
    mode: "0755"
  loop:
    - wait-for-display
    - make-xauthority

- name: Install the desktop units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: /etc/systemd/system/{{ item }}.service
    mode: "0644"
  loop: "{{ desktop_units }}"
  register: desktop_unit_files
  notify: Restart changed desktop units

- name: Enable and start the desktop units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ desktop_units }}"
