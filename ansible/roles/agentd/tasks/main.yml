# agentd: the agent on this desktop (services/agentd). It runs as its own
# user and runs the agent's shell commands as the shell user (worker), which
# can't read agentd's state, saved keys, model key or socket, nor reach the
# desktop session.

- name: Create the agentd group
  ansible.builtin.group:
    name: agentd
    system: true

- name: Create the agentd system user
  ansible.builtin.user:
    name: agentd
    group: agentd
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/agentd
    create_home: false

- name: Create the config directory
  ansible.builtin.file:
    path: /etc/agentd
    state: directory
    owner: root
    group: agentd
    mode: "0750"

- name: Create the state directory
  ansible.builtin.file:
    path: /var/lib/agentd
    state: directory
    owner: agentd
    group: agentd
    mode: "0700"

- name: Create the shell user (no sudo, no access to the desktop session)
  ansible.builtin.user:
    name: "{{ agentd_shell_user }}"
    home: /home/{{ agentd_shell_user }}
    shell: /bin/bash
    create_home: true

- name: Keep the shell user's home private
  ansible.builtin.file:
    path: /home/{{ agentd_shell_user }}
    state: directory
    mode: "0750"

- name: Create the shell user's workspace
  ansible.builtin.file:
    path: "{{ agentd_workdir }}"
    state: directory
    owner: "{{ agentd_shell_user }}"
    group: "{{ agentd_shell_user }}"
    mode: "0700"

- name: Install the firewall, proxy, and trusted credential client
  ansible.builtin.apt:
    name: [nftables, squid, gh]
    state: present

- name: Look up user IDs for the firewall
  ansible.builtin.getent:
    database: passwd

- name: Create the firewall configuration directory
  ansible.builtin.file:
    path: /etc/neo-agent
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the direct shell slice
  ansible.builtin.copy:
    dest: /etc/systemd/system/neodirect.slice
    content: |
      [Unit]
      Description=Explicitly approved direct shell commands

      [Slice]
      TasksMax={{ agentd_shell_tasks_max }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload the firewall rules

# nftables looks up neodirect.slice's cgroup when it loads the rules, so the
# slice has to be running first. Starting the guard starts it (Requires=), but
# on a desktop that already has the guard the handler only reloads it, and a
# reload doesn't start new requirements.
- name: Start the direct shell slice
  ansible.builtin.systemd_service:
    name: neodirect.slice
    state: started
    daemon_reload: true
  # A dry run hasn't written the unit yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Write the firewall rules (metadata service, desktop controls)
  ansible.builtin.template:
    src: guard.nft.j2
    dest: /etc/neo-agent/guard.nft
    owner: root
    group: root
    mode: "0644"
  vars:
    # In check mode the shell user isn't created yet: show a placeholder.
    agentd_shell_uid: "{{ ansible_facts.getent_passwd.get(agentd_shell_user, ['', 'NEW-USER'])[1] }}"
    agentd_proxy_uid: "{{ ansible_facts.getent_passwd.get('proxy', ['', 'NEW-USER'])[1] }}"
  notify: Reload the firewall rules

- name: Install the firewall unit
  ansible.builtin.template:
    src: neo-agent-guard.service.j2
    dest: /etc/systemd/system/neo-agent-guard.service
    mode: "0644"
  notify: Reload the firewall rules

- name: Enable the firewall rules
  ansible.builtin.systemd_service:
    name: neo-agent-guard
    enabled: true
    state: started
    daemon_reload: true
  # A dry run hasn't written the unit yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Set up the shell user's egress proxy
  ansible.builtin.import_tasks: egress.yml

# Squid must run with its new allowlist before the shell user downloads
# anything. This runs the handlers notified so far, so it comes before any
# task that notifies "Restart agentd": on a new desktop, agentd's unit isn't
# installed until the end of the role (found setting up a tester's desktop).
- name: Apply the proxy changes now
  ansible.builtin.meta: flush_handlers

- name: Set up Nix for the shell user
  ansible.builtin.import_tasks: nix.yml

- name: Install the binary
  ansible.builtin.copy:
    src: "{{ agentd_binary }}"
    dest: /usr/local/bin/agentd
    owner: root
    group: root
    mode: "0755"
  register: agentd_binary_install
  notify:
    - Restart agentd
    # The same binary, as the desktop user.
    - Restart the desktop broker

# A new version may migrate the database when it starts: keep a copy of it as
# it was (the last 3), for a rollback. SQLite's online backup, as the agentd
# user, so the copy is consistent while the old version still runs and no
# root-owned journal files appear next to the database.
- name: Find agentd's database
  ansible.builtin.stat:
    path: /var/lib/agentd/agentd.db
  register: agentd_db
  when: agentd_binary_install.changed

- name: Read the new agentd's version
  ansible.builtin.command: /usr/local/bin/agentd --version
  register: agentd_new_version
  changed_when: false
  when: agentd_binary_install.changed and agentd_db.stat.exists

- name: Copy agentd's database before the new version starts
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - agentd
      - --
      - /usr/bin/python3
      - -c
      - |
        import sqlite3, sys
        source = sqlite3.connect("/var/lib/agentd/agentd.db")
        copy = sqlite3.connect(sys.argv[1])
        source.backup(copy)
        copy.close()
        source.close()
      # The version and the time: redeploying the same version keeps the older copy.
      - "/var/lib/agentd/agentd.db.pre-{{ agentd_new_version.stdout.split() | last }}-{{ ansible_facts.date_time.iso8601_basic_short }}"
  when: agentd_binary_install.changed and agentd_db.stat.exists

- name: Keep the last 3 database copies
  ansible.builtin.shell: >-
    find /var/lib/agentd -maxdepth 1 -name 'agentd.db.pre-*' -printf '%T@ %p\n'
    | sort -rn | tail -n +4 | cut -d' ' -f2- | xargs -r rm -f --
  changed_when: false
  when: agentd_binary_install.changed and agentd_db.stat.exists

- name: Write the settings
  ansible.builtin.template:
    src: agentd.env.j2
    dest: /etc/agentd/agentd.env
    owner: root
    group: agentd
    mode: "0640"
  notify: Restart agentd

# Notifications to the iPhone and Mac apps: your Apple APNs key, if you ran
# make apns-key. Missing (you didn't) leaves the apps' notifications off; the
# browsers' Web Push doesn't need it.
- name: Read the APNs key for the apps (from SSM, if set up)
  ansible.builtin.set_fact:
    agentd_apns: "{{ lookup('amazon.aws.ssm_parameter', agentd_ssm_prefix ~ '/apns', region=agentd_ssm_region, on_missing='skip') | default('', true) }}"
  no_log: true

# The model key (and the APNs key), read on the controller with your AWS
# credentials, never by the desktop itself. root:agentd 0640: agentd reads it,
# the shell user can't.
- name: Write the keys agentd reads (from SSM)
  ansible.builtin.copy:
    dest: /etc/agentd/secrets.env
    content: |
      TOGETHER_API_KEY={{ lookup('amazon.aws.ssm_parameter', agentd_ssm_prefix ~ '/llm/together_api_key', region=agentd_ssm_region) }}
      {% if agentd_apns | length > 0 %}
      APNS_AUTH_KEY={{ (agentd_apns | from_json).auth_key }}
      APNS_KEY_ID={{ (agentd_apns | from_json).key_id }}
      APNS_TEAM_ID={{ (agentd_apns | from_json).team_id }}
      {% endif %}
    owner: root
    group: agentd
    mode: "0640"
  no_log: true
  notify: Restart agentd

- name: Install the agent's skills
  ansible.builtin.copy:
    src: "{{ agentd_skills_dir }}"
    dest: /etc/agentd/skills/
    owner: root
    group: agentd
    mode: "0640"
    directory_mode: "0750"
  notify: Restart agentd

- name: Write the approval rules override
  ansible.builtin.template:
    src: policy.toml.j2
    dest: /etc/agentd/policy.toml
    owner: root
    group: agentd
    mode: "0640"
  when: agentd_dangerous | length > 0
  notify: Restart agentd

- name: Use the built-in approval rules
  ansible.builtin.file:
    path: /etc/agentd/policy.toml
    state: absent
  when: agentd_dangerous | length == 0
  notify: Restart agentd

- name: Create the privileged helper directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the fixed worker and proxy administrative helper
  ansible.builtin.template:
    src: privileged.py.j2
    dest: /usr/local/libexec/neo-agent-privileged
    owner: root
    group: root
    mode: "0755"

- name: Allow agentd to use the limited administrative helper
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/agentd
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Set up native apps (desktop broker and HCU)
  ansible.builtin.import_tasks: desktop_apps.yml
  when: agentd_desktop_apps | bool

- name: Turn native apps off
  ansible.builtin.import_tasks: desktop_apps_off.yml
  when: not (agentd_desktop_apps | bool)

- name: Install the systemd unit
  ansible.builtin.template:
    src: agentd.service.j2
    dest: /etc/systemd/system/agentd.service
    mode: "0644"
  notify: Restart agentd

- name: Enable and start agentd
  ansible.builtin.systemd_service:
    name: agentd
    enabled: true
    state: started
    daemon_reload: true
