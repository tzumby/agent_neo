# XcodeGen spec: `make app-project` creates NeoAgent.xcodeproj (not checked
# in). Your Apple team and the apps' bundle ID come from the environment
# (APPLE_TEAM_ID, APP_BUNDLE_ID; scripts/project.sh checks them), so XcodeGen
# writes them into the project: run make app-project again after changing them.
name: NeoAgent
options:
  deploymentTarget:
    iOS: "18.1" # TailscaleKit's minimum
    macOS: "15.6" # DesktopKit's minimum
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Which APNs servers the app's device token is for: development for Xcode
    # installs (make app-device, make app-mac). The app tells agentd, which
    # sends to the matching servers. Push needs the paid Apple Developer
    # Program; a free account builds and runs the app, just without
    # notifications.
    APS_ENVIRONMENT: development
packages:
  DesktopKit:
    path: DesktopKit
# Two apps, one bundle ID. NeoAgent/ is shared; NeoAgent/iOS and
# NeoAgent/macOS hold what only one of them has.
targets:
  NeoAgent:
    type: application
    platform: iOS
    deploymentTarget: "26.0" # Liquid Glass; the DesktopKit package stays at 18.1
    sources:
      - path: NeoAgent
        excludes: ["macOS/**"]
    dependencies:
      - package: DesktopKit
        products: [Tailnet, AgentAPI, ChatCore, DesktopViewer]
    entitlements:
      path: NeoAgent/iOS/NeoAgent.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: NeoAgent/iOS/Info.plist
      properties:
        CFBundleDisplayName: Neo Agent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APSEnvironment: $(APS_ENVIRONMENT)
        UILaunchScreen:
          UIColorName: LaunchBackground # black, like the splash
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false

  NeoAgentMac:
    type: application
    platform: macOS
    # Runs on macOS 15.6 too, where the app draws materials instead of Liquid Glass.
    deploymentTarget: "15.6"
    sources:
      - path: NeoAgent
        excludes: ["iOS/**"]
    dependencies:
      - package: DesktopKit
        products: [Tailnet, AgentAPI, ChatCore, DesktopViewer]
    entitlements:
      path: NeoAgent/macOS/NeoAgent.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # The app's Tailscale node serves its SOCKS5 proxy on 127.0.0.1.
        com.apple.security.network.server: true
        # Memory: import a file, save an export.
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)
    info:
      path: NeoAgent/macOS/Info.plist
      properties:
        CFBundleDisplayName: Neo Agent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APSEnvironment: $(APS_ENVIRONMENT)
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}
        PRODUCT_NAME: Neo Agent
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        ARCHS: arm64 # TailscaleKit has no Intel slice
