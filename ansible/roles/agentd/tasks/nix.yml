# Nix for the shell user: single-user (no root daemon) with /nix owned by
# that user, so everything it downloads goes through the egress proxy.
# Packages come from nixpkgs-unstable (the flake registry), so they're
# current. The agent's install-software skill says how to use it.

- name: Create /nix for the shell user
  ansible.builtin.file:
    path: /nix
    state: directory
    owner: "{{ agentd_shell_user }}"
    group: "{{ agentd_shell_user }}"
    mode: "0755"

- name: Check for Nix
  ansible.builtin.stat:
    path: "{{ agentd_shell_home }}/.nix-profile/bin/nix"
  register: agentd_nix

- name: Install Nix from its release tarball (checksum pinned), as the shell user
  when: not agentd_nix.stat.exists
  block:
    - name: Make a place to unpack Nix
      ansible.builtin.file:
        path: /tmp/nix-install
        state: directory
        owner: "{{ agentd_shell_user }}"
        mode: "0755"

    - name: Download Nix {{ agentd_nix_version }}
      ansible.builtin.get_url:
        url: "https://releases.nixos.org/nix/nix-{{ agentd_nix_version }}/nix-{{ agentd_nix_version }}-{{ ansible_facts.architecture }}-linux.tar.xz"
        dest: /tmp/nix-install/nix.tar.xz
        checksum: "sha256:{{ agentd_nix_sha256[ansible_facts.architecture] }}"
        mode: "0644"

    - name: Unpack and install Nix (single-user)
      ansible.builtin.command:
        cmd: >-
          runuser -u {{ agentd_shell_user }} -- env HOME={{ agentd_shell_home }} USER={{ agentd_shell_user }}
          sh -c 'tar -xJf nix.tar.xz && cd nix-{{ agentd_nix_version }}-{{ ansible_facts.architecture }}-linux
          && ./install --no-daemon --no-channel-add --no-modify-profile --yes'
        chdir: /tmp/nix-install
        creates: "{{ agentd_shell_home }}/.nix-profile/bin/nix"
  always:
    - name: Remove the installer
      ansible.builtin.file:
        path: /tmp/nix-install
        state: absent

- name: Create the shell user's config directories
  ansible.builtin.file:
    path: "{{ agentd_shell_home }}/{{ item }}"
    state: directory
    owner: "{{ agentd_shell_user }}"
    group: "{{ agentd_shell_user }}"
    mode: "0755"
  loop: [.config, .config/nix, .npm-global]

- name: Configure Nix
  ansible.builtin.copy:
    dest: "{{ agentd_shell_home }}/.config/nix/nix.conf"
    content: |
      # Managed by Ansible (agentd role: tasks/nix.yml).
      experimental-features = nix-command flakes
      # Ubuntu blocks unprivileged user namespaces (AppArmor), which Nix's
      # build sandbox needs; builds run as the shell user anyway.
      sandbox = false
      warn-dirty = false
    owner: "{{ agentd_shell_user }}"
    group: "{{ agentd_shell_user }}"
    mode: "0644"

# Older installations scheduled worker-owned code outside command isolation.
- name: Find the legacy Nix cleanup units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop: [agentd-nix-gc.timer, agentd-nix-gc.service]
  register: agentd_legacy_nix_cleanup

- name: Stop the legacy Nix cleanup timer and service
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: "{{ false if item.item.endswith('.timer') else omit }}"
  loop: "{{ agentd_legacy_nix_cleanup.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: Remove the legacy Nix cleanup units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: [agentd-nix-gc.timer, agentd-nix-gc.service]

# Old generations of what the agent installed, weekly: the store would
# otherwise only grow. nix-collect-garbage is the shell user's own binary, so
# it runs as confined as the agent's commands and without any network at all:
# a binary the agent replaced can do nothing here that its next command
# couldn't.
- name: Install the confined Nix clean-up units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: neo-agent-nix-gc.service
      content: |
        # Managed by Ansible (agentd role: tasks/nix.yml).
        [Unit]
        Description=Remove old Nix generations and unused store paths of the shell user
        BindsTo=neo-agent-guard.service
        After=neo-agent-guard.service

        [Service]
        Type=oneshot
        User={{ agentd_shell_user }}
        Environment=HOME={{ agentd_shell_home }}
        UnsetEnvironment=BASH_ENV ENV CDPATH
        ExecStart={{ agentd_shell_home }}/.nix-profile/bin/nix-collect-garbage --delete-older-than 30d
        TimeoutStartSec=1h
        Nice=19
        IOSchedulingClass=idle
        PrivateNetwork=yes
        RestrictAddressFamilies=AF_UNIX
        NoNewPrivileges=yes
        CapabilityBoundingSet=
        AmbientCapabilities=
        PrivateTmp=yes
        PrivateDevices=yes
        ProtectSystem=full
        ProtectKernelTunables=yes
        ProtectKernelModules=yes
        ProtectKernelLogs=yes
        ProtectControlGroups=yes
        ProtectClock=yes
        ProtectHostname=yes
        ProtectProc=invisible
        RestrictSUIDSGID=yes
        RestrictRealtime=yes
        LockPersonality=yes
        KillMode=control-group
        InaccessiblePaths=-/run/systemd/resolve/io.systemd.Resolve -/run/dbus/system_bus_socket -/run/nscd/socket
        MemoryMax={{ agentd_shell_memory_max }}
        TasksMax={{ agentd_shell_tasks_max }}
        CPUQuota={{ agentd_shell_cpu_quota }}
    - name: neo-agent-nix-gc.timer
      content: |
        # Managed by Ansible (agentd role: tasks/nix.yml).
        [Unit]
        Description=Clean up the shell user's Nix store weekly

        [Timer]
        OnCalendar=weekly
        RandomizedDelaySec=1h
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

- name: Run the Nix clean-up weekly
  ansible.builtin.systemd_service:
    name: neo-agent-nix-gc.timer
    enabled: true
    state: started
    daemon_reload: true
  # A dry run hasn't written the unit yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Keep npm's global packages in the shell user's home
  ansible.builtin.copy:
    dest: "{{ agentd_shell_home }}/.npmrc"
    content: "prefix={{ agentd_shell_home }}/.npm-global\n"
    owner: "{{ agentd_shell_user }}"
    group: "{{ agentd_shell_user }}"
    mode: "0644"

# Commands run in a login shell (bash -lc), which reads ~/.profile.
- name: Put Nix and npm's global packages on the shell user's PATH
  ansible.builtin.blockinfile:
    path: "{{ agentd_shell_home }}/.profile"
    create: true
    owner: "{{ agentd_shell_user }}"
    group: "{{ agentd_shell_user }}"
    mode: "0644"
    marker: "# {mark} neo-agent: Nix and npm"
    block: |
      if [ -e "$HOME/.nix-profile/etc/profile.d/nix.sh" ]; then . "$HOME/.nix-profile/etc/profile.d/nix.sh"; fi
      export PATH="$HOME/.npm-global/bin:$PATH"

- name: Install the shell user's baseline tools (Nix, through the proxy)
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ agentd_shell_user }} -- env HOME={{ agentd_shell_home }} USER={{ agentd_shell_user }}
      https_proxy=http://127.0.0.1:{{ agentd_egress_proxy_port }} http_proxy=http://127.0.0.1:{{ agentd_egress_proxy_port }}
      bash -lc 'nix profile add {{ agentd_nix_baseline | map("regex_replace", "^", "nixpkgs#") | join(" ") }}'
    creates: "{{ agentd_shell_home }}/.nix-profile/bin/{{ agentd_nix_baseline_marker }}"
