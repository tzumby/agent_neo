# A customer deployment's desktops (docs/customer-cloud.md): the agent reads
# the customer's Cloudflare security events and Datadog logs with read-only
# keys they enter in the app, so its shell may reach those APIs.
agentd_shell_extra_domains:
  - api.cloudflare.com
  # Datadog's sites: datadoghq.com (US1, US3, US5, AP1) and datadoghq.eu.
  - .datadoghq.com
  - .datadoghq.eu
