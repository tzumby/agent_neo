# Built by `make tailnet-build` (services/tailnet-proxy).
tailnet_proxy_binary: "{{ playbook_dir }}/../../services/tailnet-proxy/build/tailnet-proxy-linux-arm64"
tailnet_proxy_hostname: cloud-desktop-dev
tailnet_proxy_novnc: http://127.0.0.1:6080
tailnet_proxy_agentd_socket: /run/agentd/agentd.sock
tailnet_proxy_vnc: 127.0.0.1:5900

tailnet_proxy_ssm_prefix: /cloud-desktops/dev
tailnet_proxy_ssm_region: "{{ lookup('ansible.builtin.env', 'AWS_REGION', default='ca-central-1') }}"

# Tailscale login names let in (comma-separated), from SSM so they stay out of
# git. Empty or missing: anyone the tailnet policy lets through.
tailnet_proxy_allow: >-
  {{ lookup('amazon.aws.ssm_parameter', tailnet_proxy_ssm_prefix ~ '/tailscale/allowed_logins',
            region=tailnet_proxy_ssm_region, on_missing='skip') | default('', true) }}
