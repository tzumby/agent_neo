# Built by `make agentd-build` (services/agentd), for this host's architecture.
agentd_binary: "{{ playbook_dir }}/../../services/agentd/target/{{ ansible_facts.architecture }}-unknown-linux-musl/release/agentd"

# The desktop session (X, Chrome) runs as this user; agentd never runs
# anything as it.
agentd_desktop_user: agent
# Shell commands run as this user, in hardened systemd units, cut off from the
# desktop: no Chrome DevTools, VNC, screen or Chrome profile.
agentd_shell_user: worker
agentd_workdir: /home/worker/work
agentd_shell_memory_max: 2G
agentd_shell_tasks_max: "512"
agentd_shell_cpu_quota: 200%
# Local ports of the desktop's controls the shell user may not reach:
# Chrome DevTools, VNC, noVNC.
agentd_guarded_ports: [9222, 5900, 6080]
# The shell user reaches the internet only through this proxy (Squid on
# localhost): listed hosts, never internal addresses, every request logged.
# A leading dot also allows subdomains.
agentd_egress_proxy_port: 3128
agentd_shell_allowed_domains:
  - .github.com
  - .githubusercontent.com
  - .npmjs.org
  - .yarnpkg.com
  - pypi.org
  - files.pythonhosted.org
  - crates.io
  - static.crates.io
  - index.crates.io
  - .rust-lang.org
  - proxy.golang.org
  - sum.golang.org
  - rubygems.org
  - nodejs.org
  - .anthropic.com
  - claude.ai
agentd_model: zai-org/GLM-5.3
agentd_max_steps: 40
agentd_shell_tool: "on"
agentd_desktop_name: cloud-desktop-dev

# Overrides the approval rules built into agentd (list of {pattern, reason};
# regex patterns without single quotes). Empty: use the built-in rules.
agentd_dangerous: []

agentd_ssm_prefix: /cloud-desktops/dev
agentd_ssm_region: "{{ lookup('ansible.builtin.env', 'AWS_REGION', default='ca-central-1') }}"
