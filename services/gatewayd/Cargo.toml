[package]
name = "gatewayd"
version = "0.2.0"
edition = "2024"
description = "Attested model gateway: forwards desktops' model calls to the provider, from an image the operator can't log into"
publish = false

[dependencies]
anyhow = "1.0.104"
aws-credential-types = "1.2.14"
aws-sigv4 = { version = "1.4.5", default-features = false, features = ["sign-http", "http1"] }
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
ring = "0.17.14"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
