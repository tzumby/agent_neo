# Chrome opens this page on start.
chrome_start_url: "https://www.google.com"

# Memory v2 (docs/memory-v2.md): kinds, trust, retrieval and consolidation.
# It passes more of the memory evals than v1; the agentd role's default
# stays "off".
agentd_memory_v2: "on"

# Claude, through Anthropic's API (make model-key stores the key). Opus 4.6
# by default; Opus 5.5 is a pick in the app. "together" goes back to Together
# AI (make model-key PROVIDER=together).
agentd_llm_provider: anthropic

# More hosts the agent's shell may reach, beyond the agentd role's list
# (agentd_shell_allowed_domains). A leading dot also allows subdomains. Sites
# you allow from the web app's Settings don't need to be here.
agentd_shell_extra_domains: []

# Native apps through Hybrid Computer Use (docs/desktop-apps.md): the agent
# reads the listed apps' windows (agentd_desktop_apps_allowed: Mousepad for
# the pilot) and clicks their controls with your OK. XFCE moves to the user's
# own bus; Chrome stays the browser tools'. Both roles read this. On where
# HCU's release runs (amd64); false turns it off.
desktop_apps: "{{ ansible_facts.architecture == 'x86_64' }}"

# Slack's app signs in through the browser and comes back by a slack:// link:
# Chrome hands those to the app, from slack.com only (desktop role).
desktop_chrome_app_links:
  - protocol: slack
    allowed_origins: ["slack.com"]
