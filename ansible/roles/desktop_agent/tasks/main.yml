# The Telegram bot that hands messages to the desktop agent
# (services/desktop-agent). Runs as the desktop user, next to Chrome.

- name: Look up the desktop user
  ansible.builtin.getent:
    database: passwd
    key: "{{ desktop_agent_user }}"

- name: Create the code directory
  ansible.builtin.file:
    path: "{{ desktop_agent_dir }}"
    state: directory
    mode: "0755"

- name: Install the code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../services/desktop-agent/{{ item }}"
    dest: "{{ desktop_agent_dir }}/"
    mode: "u=rwX,go=rX"
  loop:
    - desktop_agent
    - requirements.txt
  notify: Restart desktop-agent

- name: Install Python dependencies into a virtualenv
  ansible.builtin.pip:
    requirements: "{{ desktop_agent_dir }}/requirements.txt"
    virtualenv: "{{ desktop_agent_dir }}/venv"
    virtualenv_command: python3 -m venv
  notify: Restart desktop-agent

- name: Create the workspace and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ desktop_agent_user }}"
    group: "{{ desktop_agent_user }}"
    mode: "0700"
  loop:
    - "{{ desktop_agent_workdir }}"
    - "{{ desktop_agent_config_dir }}"

# Read on the controller with your AWS credentials, so the instance role needs
# no access to these parameters.
- name: Write the agent's config (secrets from SSM)
  ansible.builtin.template:
    src: config.env.j2
    dest: "{{ desktop_agent_config_dir }}/config.env"
    owner: "{{ desktop_agent_user }}"
    group: "{{ desktop_agent_user }}"
    mode: "0600"
  vars:
    ssm: "{{ desktop_agent_ssm_prefix }}"
  no_log: true
  notify: Restart desktop-agent

- name: Install the systemd unit
  ansible.builtin.template:
    src: desktop-agent.service.j2
    dest: /etc/systemd/system/desktop-agent.service
    mode: "0644"
  notify: Restart desktop-agent

- name: Enable and start the agent
  ansible.builtin.systemd_service:
    name: desktop-agent
    enabled: true
    state: started
    daemon_reload: true
