# Built by `make agentd-build` (services/agentd), for this host's architecture.
agentd_binary: "{{ playbook_dir }}/../../services/agentd/target/{{ ansible_facts.architecture }}-unknown-linux-musl/release/agentd"

# The desktop session (X, Chrome) runs as this user; agentd never runs
# anything as it.
agentd_desktop_user: agent
# Shell commands run as this user, in hardened systemd units, cut off from the
# desktop: no Chrome DevTools, VNC, screen or Chrome profile.
agentd_shell_user: worker
agentd_shell_home: /home/worker
agentd_workdir: /home/worker/work
agentd_shell_memory_max: 2G
agentd_shell_tasks_max: "512"
agentd_shell_cpu_quota: 200%
# Local ports of the desktop's controls the shell user may not reach:
# Chrome DevTools, VNC, noVNC.
agentd_guarded_ports: [9222, 5900, 6080]
# The shell user reaches the internet only through this proxy (Squid on
# localhost): listed hosts, never internal addresses, every request logged.
# A leading dot also allows subdomains.
agentd_egress_proxy_port: 3128
# Days of Squid's request log kept (rotated daily, compressed).
agentd_squid_log_days: 14
agentd_shell_allowed_domains:
  - .github.com
  - .githubusercontent.com
  - .npmjs.org
  - .yarnpkg.com
  - pypi.org
  - files.pythonhosted.org
  - crates.io
  - static.crates.io
  - index.crates.io
  - .rust-lang.org
  - proxy.golang.org
  - sum.golang.org
  - rubygems.org
  - nodejs.org
  - .anthropic.com
  - claude.ai
  # Together AI, for tools the user gives a key (opencode calls api.together.xyz).
  - api.together.ai
  - api.together.xyz
  # Nix: the binary cache, the flake registry, source tarballs.
  - .nixos.org
# More hosts for some desktops (group_vars or -e), e.g. an API your own
# tools call. The user can also allow sites one by one in the app.
agentd_shell_extra_domains: []
# The sites the user allows in the app, beyond those (the agent asks with a
# card, or they add them in Settings): agentd writes this file, Squid reads it.
agentd_egress_user_hosts: /etc/squid/agentd/allowed-hosts.txt
# Nix for the shell user (tasks/nix.yml): the release, its published SHA-256
# per architecture, and the tools installed up front.
agentd_nix_version: 2.35.4
agentd_nix_sha256:
  x86_64: ff66236d2f7e2a21f3350e73668e021ac6a8881ef277a38e16e952bfb22718c3
  aarch64: 14a940a2d0ae5b2c623dc2ca168311c9367fd4bc416f6ded0c1087089d6de934
agentd_nix_baseline: [uv, nodejs, gh, jq, ripgrep]
agentd_nix_baseline_marker: uv
# The agent's how-tos (services/agentd/skills).
agentd_skills_dir: "{{ playbook_dir }}/../../services/agentd/skills/"

agentd_model: zai-org/GLM-5.3
# No cap on a task's steps: a supervisor (a separate model call) checks on a
# running task after this many minutes of work or model turns, whichever comes
# first, and nudges it, asks you on a card if it looks stuck, or stops a stuck
# scheduled run (services/agentd/src/supervise.rs). 0 turns a trigger off.
agentd_review_every_minutes: 30
agentd_review_every_steps: 60
# Notifications (Web Push, from agentd to the browsers where you turned them on
# in the web app): the contact every push carries in its signed token, for the
# push services (Apple, Google, Mozilla, Microsoft) to reach whoever sends
# them. A mailto: or https: URL; yours if you like.
agentd_push_contact: "mailto:neo-agent@example.com"
agentd_shell_tool: "on"
# Memory v2 (kinds, trust, retrieval, consolidation): "off" here;
# group_vars/desktop.yml turns it on (docs/memory-v2.md §17).
agentd_memory_v2: "off"
agentd_desktop_name: "{{ (desktop_name | default('', true)) or (desktop_tailnet_name | default('neo-agent')) }}"

# Overrides the approval rules built into agentd (list of {pattern, reason};
# regex patterns without single quotes). Empty: use the built-in rules.
agentd_dangerous: []

agentd_ssm_prefix: "/neo-agent/{{ desktop_env | default('personal') }}"
agentd_ssm_region: "{{ lookup('ansible.builtin.env', 'AWS_REGION', default='ca-central-1') }}"
