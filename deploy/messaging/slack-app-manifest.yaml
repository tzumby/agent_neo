# The Slack app the agent posts updates with (docs/architecture.md §6.20).
# The customer creates it in their workspace, from the web app's Updates page:
# "Create the Slack app" opens api.slack.com/apps?new_app=1&manifest_yaml=…
# with this filled in (pick the workspace, Next, Create). Without the link:
# Create New App → From scratch → Paste a manifest → this. Then Install to
# Workspace, and copy the Bot User OAuth Token (xoxb-…) into Updates. They own
# the app and can remove it at any time. Posting only: no reading, no events
# (if Slack asks what it can respond to, add none), no Socket Mode, nothing
# that calls in. Keep in step with SLACK_MANIFEST in apps/web/public/assets/js/pages.js.
display_information:
  name: Security agent
  description: Posts updates from your agent's desktop to your channels.
features:
  bot_user:
    display_name: Security agent
    always_online: false
oauth_config:
  scopes:
    bot:
      # Post, and in public channels without being invited first.
      - chat:write
      - chat:write.public
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
