# Puts the desktop on your tailnet (the web app, agent API, noVNC, VNC). Needs the SSM
# parameter /neo-agent/<env>/tailscale/auth_key (`make tailscale-key`)
# and the binary from `make tailnet-build`. Deploy agentd first.
- name: Deploy tailnet-proxy
  hosts: desktop
  become: true
  roles:
    - tailnet_proxy
