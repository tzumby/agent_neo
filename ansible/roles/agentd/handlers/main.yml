- name: Reload the firewall rules
  ansible.builtin.systemd_service:
    name: cloud-desktop-guard
    state: restarted
    daemon_reload: true

- name: Restart Squid
  ansible.builtin.systemd_service:
    name: squid
    state: restarted

- name: Restart agentd
  ansible.builtin.systemd_service:
    name: agentd
    state: restarted
    daemon_reload: true
