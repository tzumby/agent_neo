# Logs kept to a size, so they can't fill the disk: the journal (logrotate
# looks after /var/log's files, and the agentd role after Squid's).

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Cap the journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-neo-agent.conf
    content: |
      # Managed by Ansible (common role: tasks/logs.yml).
      [Journal]
      SystemMaxUse={{ common_journal_max_use }}
      SystemKeepFree=2G
      SystemMaxFileSize=64M
      MaxRetentionSec={{ common_journal_max_retention }}
    mode: "0644"
  notify: Restart journald
