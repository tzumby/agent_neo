# agentd: the agent on this desktop (services/agentd). It runs as its own
# user and runs the agent's shell commands as the shell user (worker), which
# can't read agentd's state, saved keys or socket, nor reach the desktop
# session. Model calls go through the attested gateway, which holds the key.

- name: Remove the retired Telegram bot
  ansible.builtin.import_tasks: retire-telegram.yml
  tags: [retire-telegram]

- name: Create the agentd group
  ansible.builtin.group:
    name: agentd
    system: true

- name: Create the agentd system user
  ansible.builtin.user:
    name: agentd
    group: agentd
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/agentd
    create_home: false

- name: Create the config directory
  ansible.builtin.file:
    path: /etc/agentd
    state: directory
    owner: root
    group: agentd
    mode: "0750"

- name: Create the state directory
  ansible.builtin.file:
    path: /var/lib/agentd
    state: directory
    owner: agentd
    group: agentd
    mode: "0700"

- name: Create the shell user (no sudo, no access to the desktop session)
  ansible.builtin.user:
    name: "{{ agentd_shell_user }}"
    home: /home/{{ agentd_shell_user }}
    shell: /bin/bash
    create_home: true

- name: Keep the shell user's home private
  ansible.builtin.file:
    path: /home/{{ agentd_shell_user }}
    state: directory
    mode: "0750"

- name: Create the shell user's workspace
  ansible.builtin.file:
    path: "{{ agentd_workdir }}"
    state: directory
    owner: "{{ agentd_shell_user }}"
    group: "{{ agentd_shell_user }}"
    mode: "0700"

- name: Look up user IDs for the firewall
  ansible.builtin.getent:
    database: passwd

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Write the firewall rules (metadata service, desktop controls)
  ansible.builtin.template:
    src: guard.nft.j2
    dest: /etc/cloud-desktops/guard.nft
    owner: root
    group: root
    mode: "0644"
  vars:
    agentd_uid: "{{ ansible_facts.getent_passwd['agentd'][1] }}"
    # In check mode the shell user isn't created yet: show a placeholder.
    agentd_shell_uid: "{{ ansible_facts.getent_passwd.get(agentd_shell_user, ['', 'NEW-USER'])[1] }}"
  notify: Reload the firewall rules

- name: Install the firewall unit
  ansible.builtin.template:
    src: cloud-desktop-guard.service.j2
    dest: /etc/systemd/system/cloud-desktop-guard.service
    mode: "0644"
  notify: Reload the firewall rules

- name: Enable the firewall rules
  ansible.builtin.systemd_service:
    name: cloud-desktop-guard
    enabled: true
    state: started
    daemon_reload: true
  # A dry run hasn't written the unit yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Set up the shell user's egress proxy
  ansible.builtin.import_tasks: egress.yml

# Squid must run with its new allowlist before the shell user downloads
# anything. This runs the handlers notified so far, so it comes before any
# task that notifies "Restart agentd": on a new desktop, agentd's unit isn't
# installed until the end of the role (found setting up a tester's desktop).
- name: Apply the proxy changes now
  ansible.builtin.meta: flush_handlers

- name: Set up Nix for the shell user
  ansible.builtin.import_tasks: nix.yml

- name: Install the binary
  ansible.builtin.copy:
    src: "{{ agentd_binary }}"
    dest: /usr/local/bin/agentd
    owner: root
    group: root
    mode: "0755"
  register: agentd_binary_install
  notify: Restart agentd

# A new version may migrate the database when it starts: keep a copy of it as
# it was (the last 3), for a rollback. SQLite's online backup, as the agentd
# user, so the copy is consistent while the old version still runs and no
# root-owned journal files appear next to the database.
- name: Find agentd's database
  ansible.builtin.stat:
    path: /var/lib/agentd/agentd.db
  register: agentd_db
  when: agentd_binary_install.changed

- name: Read the new agentd's version
  ansible.builtin.command: /usr/local/bin/agentd --version
  register: agentd_new_version
  changed_when: false
  when: agentd_binary_install.changed and agentd_db.stat.exists

- name: Copy agentd's database before the new version starts
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - agentd
      - --
      - /usr/bin/python3
      - -c
      - |
        import sqlite3, sys
        source = sqlite3.connect("/var/lib/agentd/agentd.db")
        copy = sqlite3.connect(sys.argv[1])
        source.backup(copy)
        copy.close()
        source.close()
      # The version and the time: redeploying the same version keeps the older copy.
      - "/var/lib/agentd/agentd.db.pre-{{ agentd_new_version.stdout.split() | last }}-{{ ansible_facts.date_time.iso8601_basic_short }}"
  when: agentd_binary_install.changed and agentd_db.stat.exists

- name: Keep the last 3 database copies
  ansible.builtin.shell: >-
    find /var/lib/agentd -maxdepth 1 -name 'agentd.db.pre-*' -printf '%T@ %p\n'
    | sort -rn | tail -n +4 | cut -d' ' -f2- | xargs -r rm -f --
  changed_when: false
  when: agentd_binary_install.changed and agentd_db.stat.exists

# The model gateway, once it exists: where it is, how to know its
# certificate (the images to accept if it attests, else where it publishes
# the certificate) and the audience to sign identity proofs for (none secret).
- name: Look up the model gateway
  ansible.builtin.set_fact:
    agentd_gateway_url: "{{ lookup('amazon.aws.ssm_parameter', agentd_ssm_prefix ~ '/gateway/url', region=agentd_ssm_region, on_missing='skip') | default('', true) }}"
    agentd_gateway_measurements: "{{ lookup('amazon.aws.ssm_parameter', agentd_ssm_prefix ~ '/gateway/measurements', region=agentd_ssm_region, on_missing='skip') | default('', true) }}"
    agentd_gateway_certificate_parameter: "{{ lookup('amazon.aws.ssm_parameter', agentd_ssm_prefix ~ '/gateway/certificate_parameter', region=agentd_ssm_region, on_missing='skip') | default('', true) }}"
    agentd_gateway_audience: "{{ lookup('amazon.aws.ssm_parameter', agentd_ssm_prefix ~ '/gateway/audience', region=agentd_ssm_region, on_missing='skip') | default('', true) }}"

- name: Write the settings
  ansible.builtin.template:
    src: agentd.env.j2
    dest: /etc/agentd/agentd.env
    owner: root
    group: agentd
    mode: "0640"
  notify: Restart agentd

# With the gateway, the desktop holds no provider key: remove the old one.
- name: Remove the model key from the desktop (the gateway holds it)
  ansible.builtin.file:
    path: /etc/agentd/secrets.env
    state: absent
  when: agentd_gateway_url | length > 0
  notify: Restart agentd

# Without a gateway (bootstrap only), read on the controller with your AWS credentials.
- name: Write the secrets (from SSM)
  ansible.builtin.copy:
    dest: /etc/agentd/secrets.env
    content: |
      TOGETHER_API_KEY={{ lookup('amazon.aws.ssm_parameter', agentd_ssm_prefix ~ '/llm/together_api_key', region=agentd_ssm_region) }}
    owner: root
    group: agentd
    mode: "0640"
  no_log: true
  when: agentd_gateway_url | length == 0
  notify: Restart agentd

- name: Install the agent's skills
  ansible.builtin.copy:
    src: "{{ agentd_skills_dir }}"
    dest: /etc/agentd/skills/
    owner: root
    group: agentd
    mode: "0640"
    directory_mode: "0750"
  notify: Restart agentd

- name: Write the approval rules override
  ansible.builtin.template:
    src: policy.toml.j2
    dest: /etc/agentd/policy.toml
    owner: root
    group: agentd
    mode: "0640"
  when: agentd_dangerous | length > 0
  notify: Restart agentd

- name: Use the built-in approval rules
  ansible.builtin.file:
    path: /etc/agentd/policy.toml
    state: absent
  when: agentd_dangerous | length == 0
  notify: Restart agentd

- name: Let agentd start command units (as the shell user, or as root after approval)
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/agentd
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Install the systemd unit
  ansible.builtin.template:
    src: agentd.service.j2
    dest: /etc/systemd/system/agentd.service
    mode: "0644"
  notify: Restart agentd

- name: Enable and start agentd
  ansible.builtin.systemd_service:
    name: agentd
    enabled: true
    state: started
    daemon_reload: true
